services:
  questdb:
    image: ${QUESTDB_IMAGE:-questdb/questdb:9.3.2}
    container_name: questdb
    restart: unless-stopped
    environment:
      QDB_METRICS_ENABLED: TRUE
      QDB_HTTP_HEALTH_CHECK_AUTHENTICATION_REQUIRED: false
    ports:
      - "9000:9000" # Web console
      - "8812:8812" # Postgres wire protocol (Grafana)
      - "9003:9003"
      - "9009:9009" # ILP (TCP)
      - "9009:9009/udp" # ILP (UDP)
    volumes:
      - questdb-data:/var/lib/questdb
      - ./server.conf:/var/lib/questdb/conf/server.conf:ro
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.3-ubuntu}
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - questdb
    ports:
      - "3000:3000"
    environment:
      # Defaults are admin/admin; override via env if you want.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARD_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.51.2}
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - node-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.8.1}
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

volumes:
  questdb-data:
  grafana-data:
  prometheus-data:
